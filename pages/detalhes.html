<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Detalhes do Produto | Sipaúba Lanches
    </title>


    <link rel="stylesheet" href="/style/detalhes.css">


    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>


<body>


    <div class="container">


        <!--==================================================
                        CABEÇALHO
        ==================================================-->

        <header class="header">

            <h1>
                DETALHES DO PRODUTO
            </h1>

        </header>



        <!--==================================================
                        PRODUTO
        ==================================================-->

        <section class="produto">


            <!--==================================================
                        IMAGEM
            ==================================================-->

            <div class="produto-imagem">

                <img id="imagemProduto" src="" alt="Imagem do produto">

            </div>



            <!--==================================================
                    INFORMAÇÕES DO PRODUTO
            ==================================================-->

            <div class="produto-info">


                <span id="categoriaProduto" class="categoriaProduto">
                </span>


                <h2 id="nomeProduto">

                    Carregando...

                </h2>


                <div class="descricao">


                    <p id="descricaoProduto">

                        Carregando informações do produto...

                    </p>


                    <!-- PREÇO ANTIGO -->

                    <span id="precoAntigoProduto" class="precoAntigo">
                    </span>


                    <!-- PREÇO ATUAL -->

                    <h3 id="precoProduto">

                        R$ 0,00

                    </h3>



                    <!--==================================================
                            QUANTIDADE DO PRODUTO
                    ==================================================-->

                    <div class="controle-produto">


                        <div class="controle">


                            <button type="button" id="menosProduto">

                                <i class="fa-solid fa-circle-minus"></i>

                            </button>


                            <span id="quantidadeProduto">

                                1

                            </span>


                            <button type="button" id="maisProduto">

                                <i class="fa-solid fa-circle-plus"></i>

                            </button>


                        </div>


                    </div>


                    <!--==================================================
                            ESTOQUE
                    ==================================================-->

                    <p id="estoqueProduto" class="estoqueProduto">
                    </p>


                </div>

            </div>

        </section>



        <!--==================================================
                        ADICIONAIS
        ==================================================-->

        <section class="adicionais">


            <h2>

                ADICIONAIS

            </h2>


            <p class="textoAdicional">

                Escolha os adicionais que deseja incluir no seu pedido.

            </p>


            <div id="listaAdicionais">


                <p id="carregandoAdicionais">

                    Carregando adicionais...

                </p>


            </div>


        </section>



        <!--==================================================
                    OBSERVAÇÃO DO PEDIDO
        ==================================================-->

        <section class="observacaoPedido">


            <label for="observacao">

                Observação

            </label>


            <textarea id="observacao" placeholder="Ex: Sem cebola, molho separado..."></textarea>


        </section>



        <!--==================================================
                        RESUMO
        ==================================================-->

        <section class="resumoPedido">


            <div>

                <span>
                    Produto
                </span>


                <strong id="subtotalProduto">

                    R$ 0,00

                </strong>

            </div>


            <div>

                <span>
                    Adicionais
                </span>


                <strong id="subtotalAdicionais">

                    R$ 0,00

                </strong>

            </div>


            <div class="totalPedido">

                <span>
                    Total
                </span>


                <strong id="valorTotal">

                    R$ 0,00

                </strong>

            </div>


        </section>



        <!--==================================================
                        BOTÕES
        ==================================================-->

        <section class="acoes">


            <button type="button" id="btnVoltar">

                <i class="fa-solid fa-arrow-left"></i>

                VOLTAR

            </button>



            <button type="button" id="btnWhatsapp">

                <i class="fa-brands fa-whatsapp"></i>

                <span>

                    ENVIAR PEDIDO

                </span>


                <strong id="valorTotalBotao">

                    R$ 0,00

                </strong>

            </button>


        </section>


    </div>



    <!--==================================================
                        RODAPÉ
    ==================================================-->

    <footer>


        <div class="redes">


            <h3>

                REDES SOCIAIS

            </h3>


            <div class="icones">


                <a id="whatsapp" href="#">

                    <i class="fa-brands fa-whatsapp"></i>

                </a>


                <a id="instagram" href="#">

                    <i class="fa-brands fa-instagram"></i>

                </a>


                <a id="tiktok" href="#">

                    <i class="fa-brands fa-tiktok"></i>

                </a>


            </div>


        </div>



        <div class="localizacao">


            <h3>

                LOCALIZAÇÃO

            </h3>


            <p id="rua">
                Sipaúba Lanches
            </p>


            <p id="bairro">
            </p>


            <p id="cidade">
            </p>


        </div>


    </footer>



    <script src="/js/detalhes.js"></script>


</body>

</html>
