<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finalizar Pedido</title>

    <!-- CSS -->
  <link rel="stylesheet" href="/style/pagamento.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <!-- ========================= -->
    <!-- HEADER                    -->
    <!-- ========================= -->

    <header class="header">

        <div class="logo">

            <button id="btnMenu">
                <i class="fas fa-bars"></i>
            </button>

            <h1 id="nomeEmpresa"></h1>

        </div>

        <nav>

            <button id="btnInicio"></button>

            <button id="btnPedidos"></button>

        </nav>

    </header>

    <!-- ========================= -->
    <!-- MAIN                      -->
    <!-- ========================= -->

    <main class="container">

        <!-- Título -->

        <section class="titulo">

            <h2 id="tituloPagina"></h2>

            <p id="subtituloPagina"></p>

        </section>

        <!-- Formas de Pagamento -->

        <section id="formasPagamento" class="formasPagamento">

            <!-- Criado pelo JavaScript -->

        </section>

        <!-- Resumo -->

        <section class="resumoPedido">

            <div class="linhaResumo">

                <span>Subtotal</span>

                <span id="subtotal"></span>

            </div>

            <div class="linhaResumo">

                <span>Taxa de Entrega</span>

                <span id="taxaEntrega"></span>

            </div>

            <hr>

            <div class="linhaResumo total">

                <span>TOTAL</span>

                <span id="totalPedido"></span>

            </div>

        </section>

        <!-- Botões -->

        <section class="acoes">

            <button id="btnConfirmarPedido"></button>

            <button id="btnVoltarCarrinho"></button>

        </section>

    </main>

    <!-- ========================= -->
    <!-- FOOTER                    -->
    <!-- ========================= -->

    <footer class="footer">

        <div class="footer-top">

            <div class="redes">

                <h3>REDES SOCIAIS</h3>

                <div id="redesSociais">

                    <!-- JS -->

                </div>

            </div>

            <div class="localizacao">

                <h3>

                    <i class="fas fa-location-dot"></i>

                    LOCALIZAÇÃO

                </h3>

                <p id="endereco"></p>

            </div>

        </div>

        <div class="footer-bottom">

            <button id="btnAjuda"></button>

        </div>

    </footer>

    <!-- JS -->

    <script src="/js/pagamento.js"></script>

</body>

</html>
