<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro</title>
<link rel="stylesheet" href="/style/cadastro.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>

<header>
    <div class="logo-area">
        <img src="/assets/logo.png" alt="">
        <h2>Sipaúba Lanches</h2>
    </div>

    <div class="menu">
        <a href="/pages/login.html">Entrar</a>
        <a href="#" class="active">Criar Conta</a>
    </div>
</header>

<section class="container">

<div class="cadastro-box">

    <div class="left">

        <h1>Crie sua conta</h1>

        <p>
            Junte-se à família Sipaúba Lanches
            e aproveite ofertas exclusivas.
        </p>

        

    </div>

    <div class="right">

        <form id="cadastroForm">

            <label>Nome Completo</label>
            <input type="text" name="nome" placeholder="Seu nome completo">

            <div class="grid">

                <div>
                    <label>E-mail</label>
                    <input type="email" name="email" placeholder="email@exemplo.com">
                </div>

                <div>
                    <label>Telefone</label>
                    <input type="text" name="telefone" placeholder="(00) 00000-0000">
                </div>

            </div>

            <div class="grid">

                <div>
                    <label>Senha</label>
                    <input type="password" name="senha">
                </div>

                <div>
                    <label>Confirmar Senha</label>
                    <input type="password" name="confirmarSenha">
                </div>

            </div>

            <button type="submit">
                Criar minha conta
            </button>

        </form>

    </div>

</div>

<div class="termos">

    Ao criar sua conta, você declara que leu e concorda
    com nossos <strong>termos de uso</strong> e nossa
    <strong>política de privacidade</strong>.

</div>

</section>

<footer>

<p>© 2026 Sipaúba Lanches</p>

<div>
<a href="#">Suporte</a>
<a href="#">Privacidade</a>
<a href="#">Termos de uso</a>
</div>

</footer>

<script src="/js/cadastro.js"></script>

</body>
</html>
