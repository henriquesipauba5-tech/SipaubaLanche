<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Conta | Sipaúba Lanches</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../style/cadastro.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!--================ HEADER ================-->

    <header class="header">

        <div class="logo-container">

            <img
                id="logoEmpresa"
                src="../assets/logo.png"
                alt="Logo Sipaúba">

            <h2 id="empresaNome"></h2>

        </div>

        <nav class="menu">

            <button id="btnEntrarTopo"></button>

            <button id="btnCadastroTopo"></button>

        </nav>

    </header>

    <!--================ CADASTRO ================-->

    <main class="cadastro">

        <section class="cadastro-info">

            <h1 id="tituloCadastro"></h1>

            <p id="subtituloCadastro"></p>

            <img
                id="imagemCadastro"
                src="../assets/logo.png"
                alt="Logo">

        </section>

        <section class="cadastro-formulario">

            <form id="formCadastro">

                <!-- Nome -->

                <div class="campo largura-total">

                    <label for="nome">
                        Nome Completo
                    </label>

                    <input
                        type="text"
                        id="nome">

                </div>

                <!-- CPF -->

                <div class="campo">

                    <label for="cpf">
                        CPF
                    </label>

                    <input
                        type="text"
                        id="cpf">

                </div>

                <!-- Data -->

                <div class="campo">

                    <label for="dataNascimento">
                        Data de Nascimento
                    </label>

                    <input
                        type="text"
                        id="dataNascimento">

                </div>

                <!-- Email -->

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email">

                </div>

                <!-- Telefone -->

                <div class="campo">

                    <label for="telefone">
                        Telefone (WhatsApp)
                    </label>

                    <input
                        type="text"
                        id="telefone">

                </div>

                <!-- Senha -->

                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="senha-box">

                        <input
                            type="password"
                            id="senha">

                        <button
                            type="button"
                            id="mostrarSenha">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>

                <!-- Confirmar -->

                <div class="campo">

                    <label for="confirmarSenha">
                        Confirmar Senha
                    </label>

                    <div class="senha-box">

                        <input
                            type="password"
                            id="confirmarSenha">

                        <button
                            type="button"
                            id="mostrarConfirmarSenha">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>

                <!-- Termos -->

                <div class="termos">

                    <input
                        type="checkbox"
                        id="aceite">

                    <label for="aceite">

                        Li e concordo com os

                        <a href="#" id="linkTermos"></a>

                        e com a

                        <a href="#" id="linkPrivacidade"></a>

                    </label>

                </div>

                <!-- Botão -->

                <button
                    type="submit"
                    id="btnCriarConta">
                </button>

            </form>

        </section>

    </main>

    <!--================ RODAPÉ ================-->

    <footer>

        <span id="copyright"></span>

        <div class="footer-links">

            <a href="#" id="suporte"></a>

            <a href="#" id="privacidade"></a>

            <a href="#" id="termosRodape"></a>

        </div>

    </footer>

    <!--================ JAVASCRIPT ================-->

    <script src="../js/cadastro.js"></script>

</body>

</html>
