<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sipaúba Lanches</title>

    <link rel="stylesheet" href="/style/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <header>
        <div class="logo-area">
            <img src="/assets/logo.png" alt="Logo">
            <h2>Sipaúba Lanches</h2>
        </div>

        <div class="menu">
            <a href="login.html" class="active">Entrar</a>
            <a href="/pages/cadastro.html">Criar Conta</a>
        </div>
    </header>

    <section class="container">

        <div class="card-login">

            <h1>Bem-vindo(a)</h1>
            <p>Acesse sua conta para fazer seu pedido</p>

            <form id="loginForm">

                <label>E-mail ou Usuário</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                <button type="button" id="btnEntrar">
                    Entrar
                </button>

                <p id="mensagem"></p>

            </form>

            <div class="divider">
                <span>OU ENTRAR COM</span>
            </div>

            <div class="social-login">

                <button class="social-btn">
                    Google
                </button>

                <button class="social-btn">
                    Facebook
                </button>

            </div>

        </div>

    </section>

    <footer>
        <p>© 2026 Sipaúba Lanches</p>

        <div>
            <a href="#">Suporte</a>
            <a href="#">Privacidade</a>
            <a href="#">Termos de uso</a>
        </div>
    </footer>

    <script src="/js/login.js"></script>

</body>

</html>
