<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sipaúba Lanches | Produtos</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="../style/produto.css"
    >

    <!-- Ícone -->
    <link
        rel="icon"
        type="image/png"
        href="../assets/logo-navegador.png"
    >

</head>

<body>

    <!--==================================================
                        CABEÇALHO
    ==================================================-->

    <header>

        <nav>

            <button id="btnHome">

                <img src="../assets/casa.png" alt="Home">

                Home

            </button>

            <button id="btnPromocoes">

                <img src="../assets/descontos.png" alt="Promoções">

                Promoções

            </button>

            <button id="btnPedidos">

                <img src="../assets/sacola.png" alt="Pedidos">

                Pedidos

            </button>

            <button id="btnEntrar">

                <img src="../assets/usuario.png" alt="Entrar">

                Entrar / Cadastrar

            </button>

        </nav>

    </header>


    <!--==================================================
                        LOGO
    ==================================================-->

    <section class="banner">

        <img
            id="logoEmpresa"
            src="../assets/logo.png"
            alt="Logo Sipaúba Lanches"
        >

    </section>



    <!--==================================================
                    TÍTULO
    ==================================================-->

    <section class="titulo-produtos">

        <h1 id="tituloProdutos"></h1>

        <p id="subtituloProdutos"></p>

    </section>



    <!--==================================================
                    ÁREA DOS PRODUTOS
    ==================================================-->

    <main class="area-produtos">

        <div
            id="listaProdutos"
            class="lista-produtos"
        >

            <!--
                TODOS OS PRODUTOS
                SERÃO CRIADOS PELO
                JAVASCRIPT
            -->

        </div>

    </main>



    <!--==================================================
                        RODAPÉ
    ==================================================-->

    <footer>

        <div class="rodape-redes">

            <h3>

                Redes Sociais

            </h3>

            <div id="redesSociais">

            </div>

        </div>


        <div class="rodape-endereco">

            <h3>

                Localização

            </h3>

            <p id="rua"></p>

            <p id="bairro"></p>

            <p id="cidade"></p>

        </div>

    </footer>



    <!--==================================================
                    JAVASCRIPT
    ==================================================-->

    <script src="../js/produto.js"></script>

</body>

</html>
