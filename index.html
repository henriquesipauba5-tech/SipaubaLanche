<!DOCTYPE html>
<html lang="pt-BR">

<head>


    <!--==============================
            CONFIGURAÇÕES
    ==============================-->

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Sipaúba Lanches | Produtos</title>



    <!--==============================
                CSS
    ==============================-->

    <link rel="stylesheet" href="style/produto.css">



    <!--==============================
                FONTE
    ==============================-->

    <link rel="preconnect" href="https://fonts.googleapis.com">


    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">



    <!--==============================
            FONT AWESOME
    ==============================-->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">



    <!--==============================
                ÍCONE
    ==============================-->

    <link rel="icon" href="../assets/logo-navegador.png">


</head>


<body>



    <!--==============================
            CABEÇALHO
    ==============================-->


    <header class="cabecalho">


        <nav class="menu">



            <button id="btnHome">


                <i class="fa-solid fa-house"></i>


                <span>

                    Home

                </span>


            </button>





            <button id="btnPromocoes">


                <i class="fa-solid fa-tags"></i>


                <span>

                    Promoções

                </span>


            </button>





            <button id="btnPedidos">


                <i class="fa-solid fa-bag-shopping"></i>


                <span>

                    Pedidos

                </span>


            </button>





            <button id="btnEntrar">


                <i class="fa-solid fa-user"></i>


                <span>

                    Entrar

                </span>


            </button>



        </nav>


    </header>





    <!--==============================
                BANNER
==============================-->


    <section class="banner">


        <img id="logoEmpresa" src="../assets/banner.png" alt="Sipaúba Lanches">


    </section>




    <!--==============================
                TÍTULO
==============================-->


    <section class="titulo">


        <h1 id="tituloProdutos"></h1>


        <p id="subtituloProdutos"></p>



    </section>
    <!--==============================
        ÁREA DOS PRODUTOS
==============================-->


    <main class="container">



        <!--==============================
            CATEGORIAS
    ==============================-->


        <!--==============================
        CATEGORIAS
==============================-->

        <div class="categoriasProdutos" id="categoriasProdutos">

            <p>
                Carregando categorias...
            </p>

        </div>




        <!--==============================
            LISTA DOS PRODUTOS
    ==============================-->



        <section id="listaProdutos" class="listaProdutos">



            <!--

            OS PRODUTOS SERÃO

            INSERIDOS PELO JAVASCRIPT



            Exemplo:


            Card Produto


            Imagem


            Nome


            Descrição


            Preço


            Botão Escolher



        -->


        </section>


    </main>





    <!--==============================
                RODAPÉ
==============================-->



    <footer class="rodape">



        <div class="empresa">


            <h3>

                Sipaúba Lanches

            </h3>



            <p id="textoRodape"></p>



        </div>





        <div class="redes">



            <h3>

                Redes Sociais

            </h3>



            <div id="listaRedes">


                <!--

                REDES SERÃO

                INSERIDAS PELO JS


            -->


            </div>



        </div>





        <div class="endereco">



            <h3>

                Endereço

            </h3>

            <p id="enderecoEmpresa"></p>

        </div>




    </footer>





    <!--==============================
            JAVASCRIPT
==============================-->



    <script src="js/produto.js"></script>



</body>


</html>
